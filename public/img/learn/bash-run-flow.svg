<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 560" role="img" aria-labelledby="t d">
<title id="t">What happens when you run a Bash script</title>
<desc id="d">Five steps from top to bottom. One, write the file hello.sh. Two, give permission with chmod plus x. Three, the shebang line picks the bash program. Four, bash runs the lines one at a time. Five, you get output and an exit code. Exit code 0 means success, anything else means something went wrong.</desc>
<rect width="520" height="560" rx="16" fill="#faf7f0"/>
<rect x="16" y="24" width="250" height="60" rx="10" fill="#1d1b17"/>
<text x="141" y="61" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="17" fill="#f4efe3">hello.sh</text>
<text x="286" y="49" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#b45f06" letter-spacing="1">1. WRITE</text>
<text x="286" y="71" font-family="system-ui, sans-serif" font-size="15" fill="#1d1b17">Recipe card is written</text>
<path d="M133 88h16l-8 10z" fill="#b45f06"/>
<rect x="16" y="120" width="250" height="60" rx="10" fill="#1d1b17"/>
<text x="141" y="157" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="17" fill="#f4efe3">chmod +x</text>
<text x="286" y="145" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#b45f06" letter-spacing="1">2. ALLOW</text>
<text x="286" y="167" font-family="system-ui, sans-serif" font-size="15" fill="#1d1b17">Head chef stamps &quot;approved&quot;</text>
<path d="M133 184h16l-8 10z" fill="#b45f06"/>
<rect x="16" y="216" width="250" height="60" rx="10" fill="#1d1b17"/>
<text x="141" y="253" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="17" fill="#f4efe3">#!/usr/bin/env bash</text>
<text x="286" y="241" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#b45f06" letter-spacing="1">3. PICK CHEF</text>
<text x="286" y="263" font-family="system-ui, sans-serif" font-size="15" fill="#1d1b17">Card names the chef</text>
<path d="M133 280h16l-8 10z" fill="#b45f06"/>
<rect x="16" y="312" width="250" height="60" rx="10" fill="#1d1b17"/>
<text x="141" y="349" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="17" fill="#f4efe3">bash runs it</text>
<text x="286" y="337" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#b45f06" letter-spacing="1">4. COOK</text>
<text x="286" y="359" font-family="system-ui, sans-serif" font-size="15" fill="#1d1b17">Steps done one at a time</text>
<path d="M133 376h16l-8 10z" fill="#b45f06"/>
<rect x="16" y="408" width="250" height="60" rx="10" fill="#1d1b17"/>
<text x="141" y="445" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="17" fill="#f4efe3">output + exit code</text>
<text x="286" y="433" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#b45f06" letter-spacing="1">5. SERVE</text>
<text x="286" y="455" font-family="system-ui, sans-serif" font-size="15" fill="#1d1b17">Dish out, or alarm rings</text>
<text x="260" y="522" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#6b665c">exit code 0 = dish served fine</text>
<text x="260" y="542" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#6b665c">anything else = something went wrong</text>
</svg>
