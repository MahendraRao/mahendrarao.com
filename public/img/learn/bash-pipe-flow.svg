<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 460" role="img" aria-labelledby="t d">
<title id="t">How a pipe connects two commands</title>
<desc id="d">Four steps from top to bottom. The file kitchen.log is the kitchen diary. The command grep ERROR keeps only the problem lines. A pipe passes them to wc -l, which counts what is left. The answer, 2, reaches your screen.</desc>
<rect width="520" height="460" rx="16" fill="#faf7f0"/>
<rect x="16" y="24" width="250" height="60" rx="10" fill="#1d1b17"/>
<text x="141" y="61" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="16" fill="#f4efe3">kitchen.log</text>
<text x="286" y="61" font-family="system-ui, sans-serif" font-size="15" fill="#1d1b17">the kitchen diary</text>
<rect x="16" y="120" width="250" height="60" rx="10" fill="#1d1b17"/>
<text x="141" y="157" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="16" fill="#f4efe3">grep ERROR</text>
<text x="286" y="157" font-family="system-ui, sans-serif" font-size="15" fill="#1d1b17">keeps only problem lines</text>
<rect x="16" y="216" width="250" height="60" rx="10" fill="#1d1b17"/>
<text x="141" y="253" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="16" fill="#f4efe3">wc -l</text>
<text x="286" y="253" font-family="system-ui, sans-serif" font-size="15" fill="#1d1b17">counts what is left</text>
<rect x="16" y="312" width="250" height="60" rx="10" fill="#1d1b17"/>
<text x="141" y="349" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="16" fill="#f4efe3">2</text>
<text x="286" y="349" font-family="system-ui, sans-serif" font-size="15" fill="#1d1b17">the answer, on your screen</text>
<path d="M133 88h16l-8 10z" fill="#b45f06"/>
<text x="166" y="100" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#6b665c">reads</text>
<path d="M133 184h16l-8 10z" fill="#b45f06"/>
<text x="166" y="196" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#6b665c">| pipe</text>
<path d="M133 280h16l-8 10z" fill="#b45f06"/>
<text x="166" y="292" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" fill="#6b665c">prints</text>
<text x="260" y="448" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#6b665c">grep ERROR kitchen.log | wc -l</text>
</svg>
